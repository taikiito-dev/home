baseURL = "https://taikiito.com/"
locale = "en-US"
title = "Taiki Ito"

[params]
  description = "Taiki Ito's personal homepage"

# 2026-10-08: this used to also disable "RSS" and "sitemap", which was the
# right call while the site was a single profile page with nothing to
# subscribe to or crawl. Articles arrived on that date, so both came back
# on. Taxonomies stay off - tags are kept in front matter as metadata, but
# no tag pages are generated.
#
# 2026-10-11: the shelves were folded into /writing/ and the Japanese
# pages left the repository, so /writing/ is now the only section and the
# only feed. The settings below are unchanged and still correct; the
# earlier wording named /archive/ and a page count that no longer exist.
disableKinds = ["taxonomy", "term"]

[taxonomies]

[outputs]
  home = ["HTML"]
  section = ["HTML", "RSS"]

[markup]
  # Articles carry no raw HTML outside fenced code blocks (checked at
  # migration time), so goldmark's `unsafe` stays off.
  [markup.highlight]
    # Emit chroma CSS classes instead of inline styles, so static/css/site.css
    # can flatten syntax colours to plain ink. Hugo's default chroma palette
    # is built for a dark background and is close to unreadable on this
    # site's #f0eee6 paper.
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
